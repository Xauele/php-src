name: Native scalar replacement baseline

on:
  push:
    branches:
      - experiment/jit-scalar-replacement
    paths:
      - Zend/benchmarks/native_scalar_replacement.php
      - Zend/tests/optimizer/native_scalar_replacement_*.phpt
      - Zend/tests/optimizer/native_scalar_replacement_oracle.php
      - Zend/tests/optimizer/native_scalar_replacement_fuzz.php
      - docs/performance/native-scalar-replacement.md
      - .github/workflows/native-scalar-replacement.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release-nts
            configure_flags: --disable-debug --disable-zts
          - name: debug-zts
            configure_flags: --enable-debug --enable-zts
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf bison re2c pkg-config \
            libxml2-dev libsqlite3-dev

      - name: Configure PHP
        run: |
          ./buildconf --force
          ./configure \
            --disable-all \
            --enable-cli \
            --disable-cgi \
            --enable-filter \
            --enable-opcache \
            ${{ matrix.configure_flags }}

      - name: Build php-src
        run: make -j4

      - name: PHP build information
        run: |
          sapi/cli/php -v
          sapi/cli/php -n -m

      - name: Run semantic regression baselines
        run: |
          make TEST_PHP_ARGS=-j2 \
            TESTS="Zend/tests/optimizer/native_scalar_replacement_001.phpt Zend/tests/optimizer/native_scalar_replacement_002.phpt" \
            test

      - name: Run VM and native JIT benchmarks
        run: |
          mkdir -p baseline-results
          for mode in off tracing function; do
            if [ "$mode" = off ]; then
              buffer=0
            else
              buffer=128M
            fi
            sapi/cli/php -n \
              -d opcache.enable_cli=1 \
              -d opcache.file_update_protection=0 \
              -d opcache.jit_buffer_size="$buffer" \
              -d opcache.jit="$mode" \
              Zend/benchmarks/native_scalar_replacement.php 500000 \
              > "baseline-results/$mode.json"
            cat "baseline-results/$mode.json"
            MODE="$mode" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          mode = os.environ["MODE"]
          data = json.loads(Path(f"baseline-results/{mode}.json").read_text())
          assert data["iterations"] == 500_000
          assert data["checksum"] == 374_999_250_000
          assert data["jit_enabled"] == (mode != "off"), data
          for measurement in data["measurements"].values():
              assert len(measurement["samples_ms"]) == 7
              assert measurement["median_ms"] > 0
          PY
          done

      - name: Differential semantic oracle (JIT off / tracing / function)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p oracle-results
          for mode in off tracing function; do
            if [ "$mode" = off ]; then
              buffer=0
            else
              buffer=128M
            fi
            sapi/cli/php -n \
              -d opcache.enable_cli=1 \
              -d opcache.file_update_protection=0 \
              -d opcache.jit_hot_loop=16 \
              -d opcache.jit_hot_func=2 \
              -d opcache.jit_buffer_size="$buffer" \
              -d opcache.jit="$mode" \
              Zend/tests/optimizer/native_scalar_replacement_oracle.php \
              > "oracle-results/$mode.json"
            test -s "oracle-results/$mode.json"
          done
          diff -u oracle-results/off.json oracle-results/tracing.json
          diff -u oracle-results/off.json oracle-results/function.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              'simple', 'reference', 'identity', 'hooked', 'lifecycle',
              'uninitialized', 'readonly', 'magic', 'reflection',
              'weak_reference', 'weak_map', 'clone', 'closure_escape',
              'exceptions', 'polymorphic', 'polymorphic_hook_counts',
              'enumeration',
          }
          result = json.loads(Path('oracle-results/off.json').read_text())
          assert set(result) == expected, (set(result) - expected, expected - set(result))
          print(f'Semantic checks: {len(result)} x 3 JIT modes = {len(result) * 3}')
          PY
          sha256sum oracle-results/*.json

      - name: Seeded metamorphic fuzz (16 mutations x 4 seeds)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fuzz-results
          for mode in off tracing function; do
            if [ "$mode" = off ]; then
              buffer=0
            else
              buffer=128M
            fi
            sapi/cli/php -n \
              -d opcache.enable_cli=1 \
              -d opcache.file_update_protection=0 \
              -d opcache.jit_hot_loop=16 \
              -d opcache.jit_hot_func=2 \
              -d opcache.jit_buffer_size="$buffer" \
              -d opcache.jit="$mode" \
              Zend/tests/optimizer/native_scalar_replacement_fuzz.php \
              > "fuzz-results/$mode.json"
            test -s "fuzz-results/$mode.json"
          done
          diff -u fuzz-results/off.json fuzz-results/tracing.json
          diff -u fuzz-results/off.json fuzz-results/function.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          # Independent expected values from the known-good PHP 8.4.24 VM.
          expected = {
              '1': (9015514, 2080),
              '7': (8927881, 2040),
              '137': (8968864, 2081),
              '31337': (8922245, 2053),
          }
          output = json.loads(Path('fuzz-results/off.json').read_text())
          assert set(output) == set(expected), output
          for seed, (checksum, escapes, coverage) in output.items():
              assert (checksum, escapes) == expected[seed], (seed, checksum, escapes)
              assert len(coverage) == 16, (seed, coverage)
              assert sum(coverage) == 8192, (seed, coverage)
              assert all(n > 0 for n in coverage), (seed, coverage)
          print('Metamorphic operations: 32768 x 3 JIT modes = 98304 per build')
          PY
          sha256sum fuzz-results/*.json

      - name: Confirm real JIT trace compilation
        if: matrix.name == 'release-nts'
        shell: bash
        run: |
          set -euo pipefail
          sapi/cli/php -n \
            -d opcache.enable_cli=1 \
            -d opcache.file_update_protection=0 \
            -d opcache.jit=tracing \
            -d opcache.jit_hot_loop=16 \
            -d opcache.jit_debug=16384 \
            -d opcache.jit_buffer_size=128M \
            Zend/tests/optimizer/native_scalar_replacement_fuzz.php \
            > jit-proof.json 2> jit-proof.log
          grep -Eq 'TRACE [0-9]+ compiled' jit-proof.log
          head -n 20 jit-proof.log

      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sra-${{ matrix.name }}
          path: |
            baseline-results/*.json
            oracle-results/*.json
            fuzz-results/*.json
            jit-proof.log
          if-no-files-found: ignore
