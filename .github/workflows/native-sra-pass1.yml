name: Experimental native SRA pass1
on:
  push:
    branches: [experiment/native-sra-pass1-prototype, experiment/native-sra-proof-v2, experiment/native-sra-dynamic-v0]
    paths:
      - Zend/Optimizer/pass1.c
      - Zend/benchmarks/native_sra_pass1_probe.php
      - Zend/tests/optimizer/native_sra_pass1_*
      - scripts/ci/native_sra_compare.py
      - scripts/ci/native_sra_verify_opcodes.py
      - scripts/ci/native_sra_mutate.py
      - docs/performance/native-sra-proof-v2.md
      - Zend/tests/optimizer/native_sra_dynamic_*
      - Zend/benchmarks/native_sra_dynamic_probe.php
      - .github/workflows/native-sra-pass1.yml
  pull_request:
    paths:
      - Zend/Optimizer/pass1.c
      - Zend/tests/optimizer/native_sra_pass1_*
      - scripts/ci/native_sra_verify_opcodes.py
      - .github/workflows/native-sra-pass1.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline-release
            sra: false
            cflags: "-g -O2"
            debug: false
            zts: false
          - name: candidate-release
            sra: true
            cflags: "-g -O2 -DZEND_SRA_EXPERIMENTAL=1"
            debug: false
            zts: false
          - name: candidate-debug-zts
            sra: true
            cflags: "-g -O0 -DZEND_SRA_EXPERIMENTAL=1"
            debug: true
            zts: true
          - name: candidate-asan-ubsan
            sra: true
            cflags: "-g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined -DZEND_TRACK_ARENA_ALLOC -DZEND_SRA_EXPERIMENTAL=1"
            ldflags: "-fsanitize=address,undefined"
            debug: true
            zts: true
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies and fingerprint platform
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf bison re2c pkg-config \
            libxml2-dev libsqlite3-dev
          git rev-parse HEAD
          gcc --version | head -n 1
          uname -a
      - name: Configure PHP
        shell: bash
        env:
          BUILD_CFLAGS: ${{ matrix.cflags }}
          BUILD_LDFLAGS: ${{ matrix.ldflags || '' }}
          DEBUG_BUILD: ${{ matrix.debug }}
          ZTS_BUILD: ${{ matrix.zts }}
        run: |
          set -euo pipefail
          ./buildconf --force
          set -- --disable-all --enable-cli --disable-cgi --enable-filter
          if [[ "$DEBUG_BUILD" == "true" ]]; then
            set -- "$@" --enable-debug
          else
            set -- "$@" --disable-debug
          fi
          if [[ "$ZTS_BUILD" == "true" ]]; then
            set -- "$@" --enable-zts
          else
            set -- "$@" --disable-zts
          fi
          CFLAGS="$BUILD_CFLAGS" LDFLAGS="$BUILD_LDFLAGS" ./configure "$@"
      - name: Compile PHP
        run: make -j4
      - name: Build identity
        run: |
          sapi/cli/php -v
          sapi/cli/php -n -m
      - name: Export identically configured release binary
        if: matrix.name == 'baseline-release' || matrix.name == 'candidate-release'
        run: |
          mkdir -p native-proof
          cp sapi/cli/php native-proof/php
          chmod +x native-proof/php
          sha256sum native-proof/php
      - name: Upload release binary for same-runner comparison
        if: matrix.name == 'baseline-release' || matrix.name == 'candidate-release'
        uses: actions/upload-artifact@v4
        with:
          name: native-sra-bin-${{ matrix.name }}
          path: native-proof/php
          if-no-files-found: error
          retention-days: 7
      - name: PHPT semantic regression
        run: |
          make TEST_PHP_ARGS=-j2 TESTS="Zend/tests/optimizer/native_sra_pass1_prototype.phpt Zend/tests/optimizer/native_sra_pass1_guards.phpt Zend/tests/optimizer/native_sra_dynamic_001.phpt" test
      - name: Verify optimized opcodes for 12 safe and unsafe variants
        shell: bash
        env:
          SRA_ENABLED: ${{ matrix.sra }}
        run: |
          set -euo pipefail
          mkdir -p native-proof
          sapi/cli/php -n \
            -d opcache.enable_cli=1 \
            -d opcache.file_update_protection=0 \
            -d opcache.opt_debug_level=131072 \
            Zend/tests/optimizer/native_sra_pass1_inspect.php \
            > native-proof/inspect.out 2> native-proof/opcodes.log
          grep -qx 'NATIVE_SRA_SEMANTICS_OK' native-proof/inspect.out
          python3 scripts/ci/native_sra_verify_opcodes.py \
            --log native-proof/opcodes.log \
            --enabled "$SRA_ENABLED" \
            --output native-proof/opcode-verification.json
      - name: Execute real candidates under VM and JIT modes
        if: matrix.sra
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-proof
          for mode in off tracing function; do
            if [ "$mode" = off ]; then
              buffer=0
            else
              buffer=64M
            fi
            sapi/cli/php -n -d opcache.enable_cli=1 \
              -d opcache.file_update_protection=0 \
              -d opcache.jit_hot_func=2 \
              -d opcache.jit_hot_loop=16 \
              -d opcache.jit_buffer_size="$buffer" \
              -d opcache.jit="$mode" \
              Zend/tests/optimizer/native_sra_pass1_inspect.php \
              > "native-proof/candidate-$mode.out"
            grep -qx 'NATIVE_SRA_SEMANTICS_OK' "native-proof/candidate-$mode.out"
            sapi/cli/php -n -d opcache.enable_cli=1 \
              -d opcache.jit_buffer_size="$buffer" -d opcache.jit="$mode" \
              -r '$status=opcache_get_status(false); exit((int) ($status["jit"]["on"] ?? false) !== (int) ($argv[1] !== "off"));' "$mode"
          done
          diff -u native-proof/candidate-off.out native-proof/candidate-tracing.out
          diff -u native-proof/candidate-off.out native-proof/candidate-function.out
      - name: Verify actual scalar forwarding in dynamic int methods
        shell: bash
        env:
          SRA_ENABLED: ${{ matrix.sra }}
        run: |
          set -euo pipefail
          mkdir -p native-proof
          sapi/cli/php -n -d opcache.enable_cli=1 \
            -d opcache.file_update_protection=0 \
            -d opcache.opt_debug_level=131072 \
            Zend/tests/optimizer/native_sra_dynamic_inspect.php \
            > native-proof/dynamic-inspect.out 2> native-proof/dynamic-opcodes.log
          grep -qx 'DYNAMIC_SRA_OK' native-proof/dynamic-inspect.out
          SRA_ON="$SRA_ENABLED" python3 - <<'PY'
          import os, re
          from pathlib import Path
          log = Path('native-proof/dynamic-opcodes.log').read_text()
          def has_new(name):
              marker = name + ':'
              assert marker in log, name
              sections = log.split(marker)[1:]
              optimized = [s.split('\n\n', 1)[0] for s in sections
                           if '(after optimizer)' in s.split('\n\n', 1)[0]]
              assert optimized, name
              return bool(re.search(r'(?m)^\s*\d+\s+.*\bNEW\b', optimized[-1]))
          enabled = os.environ['SRA_ON'] == 'true'
          actual = has_new('SraDynCandidate::identity')
          assert actual != enabled, f'candidate NEW present={actual}, SRA_ENABLED={enabled}'
          for name in ('SraDynConstructorExcluded::identity',
                       'SraDynStringExcluded::identity',
                       'SraDynRefExcluded::identity'):
              assert has_new(name), name
          print('Dynamic scalar forwarding opcode proof: PASS')
          PY

      - name: Differential runtime int forwarding in VM, tracing and function JIT
        if: matrix.sra
        shell: bash
        run: |
          set -euo pipefail
          for mode in off tracing function; do
            if [ "$mode" = off ]; then
              buffer=0
            else
              buffer=64M
            fi
            sapi/cli/php -n \
              -d opcache.enable_cli=1 \
              -d opcache.file_update_protection=0 \
              -d opcache.jit_hot_func=2 \
              -d opcache.jit_hot_loop=16 \
              -d opcache.jit_buffer_size="$buffer" \
              -d opcache.jit="$mode" \
              Zend/tests/optimizer/native_sra_dynamic_inspect.php \
              > "native-proof/dynamic-$mode.out"
            grep -qx 'DYNAMIC_SRA_OK' "native-proof/dynamic-$mode.out"
          done
          cmp native-proof/dynamic-off.out native-proof/dynamic-tracing.out
          cmp native-proof/dynamic-off.out native-proof/dynamic-function.out

      - name: Benchmark same codepath with and without C macro
        run: |
          sapi/cli/php -n \
            -d opcache.enable_cli=1 \
            -d opcache.file_update_protection=0 \
            -d opcache.jit_buffer_size=0 \
            Zend/benchmarks/native_sra_pass1_probe.php 250000 \
            > native-proof/benchmark.json
          cat native-proof/benchmark.json
      - name: Existing JIT regression suite
        if: matrix.name == 'candidate-release'
        run: |
          make TEST_PHP_ARGS=-j4 TESTS=ext/opcache/tests/jit/ test
      - name: Differential semantic and seeded fuzz oracles
        if: matrix.sra
        shell: bash
        run: |
          set -euo pipefail
          for fixture in oracle fuzz; do
            for mode in off tracing function; do
              if [ "$mode" = off ]; then
                buffer=0
              else
                buffer=128M
              fi
              sapi/cli/php -n \
                -d opcache.enable_cli=1 \
                -d opcache.file_update_protection=0 \
                -d opcache.jit_hot_loop=16 \
                -d opcache.jit_hot_func=2 \
                -d opcache.jit_buffer_size="$buffer" \
                -d opcache.jit="$mode" \
                "Zend/tests/optimizer/native_scalar_replacement_$fixture.php" \
                > "native-proof/$fixture-$mode.json"
            done
            diff -u "native-proof/$fixture-off.json" "native-proof/$fixture-tracing.json"
            diff -u "native-proof/$fixture-off.json" "native-proof/$fixture-function.json"
          done
          sha256sum native-proof/oracle-*.json native-proof/fuzz-*.json
      - name: Validate persistent OPcache file cache across CLI processes
        if: matrix.name == 'candidate-release'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-proof/file-cache
          for n in 1 2 3; do
            sapi/cli/php -n \
              -d opcache.enable_cli=1 \
              -d opcache.file_update_protection=0 \
              -d opcache.file_cache="$PWD/native-proof/file-cache" \
              -d opcache.file_cache_only=1 \
              -d opcache.jit=off \
              Zend/tests/optimizer/native_sra_pass1_cache_request.php \
              > "native-proof/file-cache-$n.json"
          done
          cmp native-proof/file-cache-1.json native-proof/file-cache-2.json
          cmp native-proof/file-cache-2.json native-proof/file-cache-3.json
          test "$(find native-proof/file-cache -type f -name '*.bin' | wc -l)" -gt 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          o = json.loads(Path('native-proof/file-cache-3.json').read_text())
          assert o['folded'] == 42 and o['constructor_calls'] == 1, o
          PY

      - name: Validate startup preloading with the native optimizer
        if: matrix.name == 'candidate-release'
        shell: bash
        run: |
          set -euo pipefail
          sapi/cli/php -n -d opcache.enable_cli=1 \
            -d opcache.file_update_protection=0 \
            -d opcache.preload="$PWD/Zend/tests/optimizer/native_sra_pass1_cache_preload.inc" \
            -d opcache.jit=off \
            Zend/tests/optimizer/native_sra_pass1_cache_request.php \
            > native-proof/preloaded.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('native-proof/preloaded.json').read_text())
          assert result['folded'] == 42 and result['constructor_calls'] == 1, result
          PY

      - name: Validate multiple independent HTTP requests with OPcache
        if: matrix.name == 'candidate-release'
        shell: bash
        run: |
          set -euo pipefail
          sapi/cli/php -n \
            -d opcache.enable=1 \
            -d opcache.enable_cli=1 \
            -d opcache.file_update_protection=0 \
            -d opcache.validate_timestamps=0 \
            -d opcache.jit_buffer_size=0 \
            -S 127.0.0.1:19873 -t Zend/tests/optimizer \
            > native-proof/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS 'http://127.0.0.1:19873/native_sra_pass1_cache_request.php' \
                 > native-proof/http-01.json; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" = 1
          for n in $(seq -w 2 20); do
            curl -fsS 'http://127.0.0.1:19873/native_sra_pass1_cache_request.php' \
              > "native-proof/http-$n.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for file in sorted(Path('native-proof').glob('http-*.json')):
              o = json.loads(file.read_text())
              assert o['sapi'] == 'cli-server', (file, o)
              assert o['folded'] == 42, (file, o)
              assert o['constructor_calls'] == 1, (file, o)
              assert o['opcache_enabled'], (file, o)
          print('Validated 20 HTTP requests in one persistent CLI-server process')
          PY

      - name: Kill unsafe C mutants with real PHP bytecode checks
        if: matrix.name == 'candidate-release'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-proof/mutations
          for kind in constructor unrelated-default visibility; do
            git restore -- Zend/Optimizer/pass1.c
            python3 scripts/ci/native_sra_mutate.py "$kind"
            make -j4 > "native-proof/mutations/$kind-build.log" 2>&1
            set +e
            sapi/cli/php -n -d opcache.enable_cli=1 \
              -d opcache.file_update_protection=0 \
              -d opcache.opt_debug_level=131072 \
              Zend/tests/optimizer/native_sra_pass1_inspect.php \
              > "native-proof/mutations/$kind-output.txt" \
              2> "native-proof/mutations/$kind-opcodes.log"
            runtime_rc=$?
            python3 scripts/ci/native_sra_verify_opcodes.py \
              --log "native-proof/mutations/$kind-opcodes.log" \
              --enabled true \
              --output "native-proof/mutations/$kind-verification.json" \
              > "native-proof/mutations/$kind-checker.txt" \
              2> "native-proof/mutations/$kind-checker.err"
            checker_rc=$?
            set -e
            test "$checker_rc" -ne 0
            case "$kind" in
              constructor)
                grep -Fq "SraExcluded::value" "native-proof/mutations/$kind-checker.err"
                test "$runtime_rc" -ne 0
                ;;
              unrelated-default)
                grep -Fq "SraExtraStringExcluded::value" "native-proof/mutations/$kind-checker.err"
                ;;
              visibility)
                grep -Fq "SraAsymmetricExcluded::value" "native-proof/mutations/$kind-checker.err"
                ;;
            esac
            echo "KILLED $kind" | tee -a native-proof/mutations/summary.txt
          done
          git restore -- Zend/Optimizer/pass1.c
          test "$(grep -c '^KILLED ' native-proof/mutations/summary.txt)" -eq 3

      - name: Preserve evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sra-pass1-${{ matrix.name }}
          path: native-proof/
          if-no-files-found: warn

  controlled-abba-benchmark:
    name: Paired ABBA same-host performance evidence
    needs: build-and-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Download unmodified and experimental PHP builds
        uses: actions/download-artifact@v4
        with:
          name: native-sra-bin-baseline-release
          path: native-sra-builds/baseline
      - name: Download native candidate binary
        uses: actions/download-artifact@v4
        with:
          name: native-sra-bin-candidate-release
          path: native-sra-builds/candidate
      - name: Compare on identical runner with alternating order
        shell: bash
        run: |
          set -euo pipefail
          chmod +x native-sra-builds/baseline/php native-sra-builds/candidate/php
          git rev-parse HEAD
          uname -a
          lscpu | head -n 18
          python3 scripts/ci/native_sra_compare.py \
            --baseline native-sra-builds/baseline/php \
            --candidate native-sra-builds/candidate/php \
            --iterations 500000 \
            --pairs 12 \
            --output native-proof/paired_abba.json
          python3 scripts/ci/native_sra_compare.py \
            --baseline native-sra-builds/baseline/php \
            --candidate native-sra-builds/candidate/php \
            --source Zend/benchmarks/native_sra_dynamic_probe.php \
            --iterations 500000 \
            --pairs 12 \
            --output native-proof/dynamic_abba.json
      - name: Preserve controlled comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sra-controlled-abba
          path: |
            native-proof/paired_abba.json
            native-proof/dynamic_abba.json
          if-no-files-found: warn
