name: GH-24280 current qualification
on:
  push:
    branches: [fix/gh24280-opt-20261023]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.generated.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: sudo apt-get update && sudo apt-get install -y php-cli
      - id: generated
        run: |
          php Zend/zend_vm_gen.php
          git add Zend/zend_vm_execute.h Zend/zend_vm_opcodes.c Zend/zend_vm_opcodes.h
          if ! git diff --cached --quiet; then
            git -c user.name='Xauele' -c user.email='251239544+Xauele@users.noreply.github.com' commit -m 'Regenerate Zend VM executor from current patched source'
            git push origin HEAD:refs/heads/fix/gh24280-opt-20261023 --force-with-lease=refs/heads/fix/gh24280-opt-20261023:${{ github.sha }}
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native:
    needs: generated
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: PHP-8.4
            base: f6852befa34b1107da57d26ead79e575ccd73e2a
            flags: --enable-opcache
          - version: PHP-8.4-ZTS
            base: f6852befa34b1107da57d26ead79e575ccd73e2a
            flags: --enable-opcache --enable-zts
          - version: PHP-8.5
            base: 9da174f52a1d4f9f1f3613ade049283ca3995875
            flags: ''
          - version: PHP-8.6
            base: 644b5e88967cf3521de9631521849bf48daed390
            flags: ''
          - version: master
            base: 022073187266c934fea9d5aafd9dde49cc09d449
            flags: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.generated.outputs.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: php/php-src
          ref: ${{ matrix.base }}
          path: source
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf bison re2c build-essential pkg-config libxml2-dev php-cli
      - name: Build exact unmodified base
        working-directory: source
        run: |
          ./buildconf --force
          php Zend/zend_vm_gen.php
          ./configure --disable-all --enable-cli --disable-cgi --enable-debug ${{ matrix.flags }}
          make -j2 > /tmp/build-base.log 2>&1 || { tail -100 /tmp/build-base.log; exit 1; }
      - name: Reproduce setter bypass on exact base
        run: python3 candidate/.github/gh24280/check.py baseline source/sapi/cli/php candidate/Zend/tests/asymmetric_visibility
      - name: Apply patch and rebuild
        working-directory: source
        run: |
          git apply --check ../candidate/.github/gh24280/vm.patch
          git apply ../candidate/.github/gh24280/vm.patch
          cp ../candidate/Zend/tests/asymmetric_visibility/gh24280*.phpt Zend/tests/asymmetric_visibility/
          php Zend/zend_vm_gen.php
          if [ '${{ matrix.version }}' = 'PHP-8.4' ]; then cmp Zend/zend_vm_execute.h ../candidate/Zend/zend_vm_execute.h; fi
          make -j2 > /tmp/build-patch.log 2>&1 || { tail -100 /tmp/build-patch.log; exit 1; }
      - name: Complete Zend test suite
        working-directory: source
        env:
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1
        run: sapi/cli/php -n run-tests.php -q -j2 Zend/tests
      - name: Interpreter OPcache and real JIT checks
        if: success() || failure()
        run: python3 candidate/.github/gh24280/check.py patched source/sapi/cli/php source/Zend/tests/asymmetric_visibility
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.version }}
          path: |
            source/Zend/tests/**/*.diff
            source/Zend/tests/**/*.out
  performance:
    needs: generated
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.generated.outputs.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: php/php-src
          ref: f6852befa34b1107da57d26ead79e575ccd73e2a
          path: source
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y autoconf bison re2c build-essential pkg-config libxml2-dev php-cli
      - name: Build release baseline and candidate identically
        working-directory: source
        run: |
          ./buildconf --force
          php Zend/zend_vm_gen.php
          ./configure --disable-all --enable-cli --disable-cgi
          make -j2 > /tmp/build-base.log 2>&1 || { tail -100 /tmp/build-base.log; exit 1; }
          cp sapi/cli/php ../php-baseline
          git apply ../candidate/.github/gh24280/vm.patch
          php Zend/zend_vm_gen.php
          make -j2 > /tmp/build-patch.log 2>&1 || { tail -100 /tmp/build-patch.log; exit 1; }
          cp sapi/cli/php ../php-patched
      - name: Alternating same-runner A/B microbenchmark
        run: python3 candidate/.github/gh24280/bench.py php-baseline php-patched candidate/.github/gh24280/bench.php
      - uses: actions/upload-artifact@v4
        with:
          name: foreach-ab-benchmark
          path: benchmark.json
