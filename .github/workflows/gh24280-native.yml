name: GH-24280 native Zend regression

on:
  push:
    branches: [fix/gh-24280-foreach-asymmetric-visibility]
  pull_request:
    branches: [PHP-8.4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh24280-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-red:
    name: Baseline RED (unmodified PHP-8.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout original PHP-8.4
        uses: actions/checkout@v4
        with:
          ref: PHP-8.4
          path: baseline
      - name: Checkout candidate tests
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf bison re2c build-essential pkg-config libxml2-dev php-cli
      - name: Build unpatched PHP
        working-directory: baseline
        run: |
          ./buildconf --force
          ./configure --disable-all --enable-cli --enable-debug
          make -j2
      - name: Assert four exact RED counterexamples
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile

          source = Path('candidate/Zend/tests/asymmetric_visibility/gh24280_foreach_by_ref.phpt').read_text()
          program = source.split('--FILE--\n', 1)[1].split('--EXPECT--\n', 1)[0]
          with tempfile.TemporaryDirectory() as directory:
              script = Path(directory) / 'gh24280.php'
              script.write_text(program)
              result = subprocess.run(['baseline/sapi/cli/php', '-n', str(script)], text=True, capture_output=True)
          assert result.returncode == 0, result.stderr
          for signal in (
              'private outside: accepted',
              'existing reference outside: accepted',
              'private child: accepted',
              'protected outside: accepted',
          ):
              assert signal in result.stdout, f'Missing RED signal {signal!r}: {result.stdout}'
          assert 'readonly outside: Cannot acquire reference' in result.stdout
          print('RED verified: four setter-visibility bypasses; readonly control intact')
          PY

  native-green:
    name: Native GREEN (${{ matrix.build }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        build: [debug-nts, debug-zts]
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf bison re2c build-essential pkg-config libxml2-dev php-cli
      - name: Build native Zend Engine (debug)
        run: |
          ./buildconf --force
          ZTS_FLAG=''
          if [ '${{ matrix.build }}' = 'debug-zts' ]; then ZTS_FLAG='--enable-zts'; fi
          ./configure --disable-all --enable-cli --enable-debug --enable-opcache $ZTS_FLAG
          make -j2
          sapi/cli/php -v
      - name: Native PHPT regression and neighboring tests
        run: |
          make test TESTS='Zend/tests/asymmetric_visibility'
          make test TESTS='Zend/tests/readonly_props/gh7942.phpt'
      - name: Exact-output checks for interpreter, OPcache and JIT modes
        run: |
          python3 - <<'PY'
          from difflib import unified_diff
          from pathlib import Path
          import subprocess
          import tempfile

          files = [
              Path('Zend/tests/asymmetric_visibility/gh24280_foreach_by_ref.phpt'),
              Path('Zend/tests/asymmetric_visibility/gh24280_foreach_by_ref_controls.phpt'),
          ]
          opcache = Path('modules/opcache.so').resolve()
          assert opcache.is_file(), 'OPcache module missing: do not silently skip JIT'
          modes = {
              'interpreter': ['-n'],
              'opcache': ['-n', '-d', f'zend_extension={opcache}', '-d', 'opcache.enable_cli=1'],
              'jit-tracing': ['-n', '-d', f'zend_extension={opcache}', '-d', 'opcache.enable_cli=1', '-d', 'opcache.jit_buffer_size=64M', '-d', 'opcache.jit=tracing'],
              'jit-function': ['-n', '-d', f'zend_extension={opcache}', '-d', 'opcache.enable_cli=1', '-d', 'opcache.jit_buffer_size=64M', '-d', 'opcache.jit=function'],
          }
          php = str(Path('sapi/cli/php').resolve())
          with tempfile.TemporaryDirectory() as directory:
              for test in files:
                  content = test.read_text()
                  script = Path(directory) / (test.stem + '.php')
                  script.write_text(content.split('--FILE--\n', 1)[1].split('--EXPECT--\n', 1)[0])
                  expected = content.split('--EXPECT--\n', 1)[1].strip()
                  for name, options in modes.items():
                      result = subprocess.run([php, *options, str(script)], text=True, capture_output=True)
                      actual = result.stdout.strip()
                      if result.returncode != 0 or actual != expected or result.stderr:
                          print(f'FAILED {test.name} / {name}: exit={result.returncode}, stderr={result.stderr}')
                          print('\n'.join(unified_diff(expected.splitlines(), actual.splitlines(), fromfile='expected', tofile='actual', lineterm='')))
                          raise SystemExit(1)
                      print(f'PASS {test.name} / {name}')
          PY
